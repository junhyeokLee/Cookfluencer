name: Flutter CI/CD

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 실행
  pull_request:
    branches:
      - main  # main 브랜치로 PR 생성 시 실행

jobs:
  build:
    runs-on: ubuntu-latest  # Linux 환경에서 실행

    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # GitHub 저장소의 코드를 가져옵니다.

    - name: Set up Flutter
      uses: subosito/flutter-action@v2.2.0  # 최신 Flutter Action 사용
      with:
        flutter-version: 'stable'  # Flutter 버전 (명확히 지정 가능)

    - name: Install dependencies
      run: flutter pub get  # 프로젝트 의존성 설치

    - name: Run tests
      run: flutter test
