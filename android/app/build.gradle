plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.devsheep.cookfluencer"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
     namespace = "com.devsheep.cookfluencer"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        minSdkVersion 23  // 🔥 최소 버전을 23으로 변경
        targetSdkVersion 33

        versionCode = 13
        versionName = "1.0.12"
    }
    signingConfigs {
        release {
            storeFile file("cookfluencer-release-key.jks") // 키 저장 경로
            storePassword "ckwer2000" // keystore 비밀번호
            keyAlias "my-key-alias" // 키 별칭
            keyPassword "ckwer2000" // 키 비밀번호
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
//            signingConfig = signingConfigs.debug
            signingConfig signingConfigs.release
        }
    }
    dependencies {
        implementation 'com.igaworks.ssp:IgawAdPopcornSSP:3.7.0'
    }
}


flutter {
    source = "../.."
}
